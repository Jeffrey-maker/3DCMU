<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Campus Route 3D</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css">
  <style>
    .viewer #scene{position:absolute;inset:0}
    .route-meta{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 2px}
    .route-meta span{padding:4px 7px;border-radius:4px;background:#deede8;color:#176668;font-size:10px;font-weight:800}
    .route-meta .recommended{background:#172126;color:#fff}
    .room-label{padding:1px 3px;border:1px solid #087f82;border-radius:2px;background:rgba(255,255,255,.92);color:#172126;font:700 8px/1.2 -apple-system,sans-serif;white-space:nowrap}
  </style>
  <script type="importmap">
    {"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}
  </script>
</head>
<body>
  <div class="app">
    <header>
      <div><small>CMU indoor navigation</small><h1>Campus Route</h1></div>
      <button class="icon-button" id="reset-view" title="Reset 3D view" aria-label="Reset 3D view">⌂</button>
    </header>
    <main>
      <section class="viewer" aria-label="Interactive 3D map">
        <div id="scene"></div>
        <div class="viewer-top">
          <div class="map-filter"><div class="segmented" aria-label="Visible building"><button class="active" data-building="all">All</button><button data-building="SH">Scott</button><button data-building="WEH">Wean</button></div><select id="floor-filter" aria-label="Visible floor"><option value="all">All floors</option></select></div>
          <button class="icon-button glass" id="rotate" title="Toggle automatic rotation" aria-label="Toggle automatic rotation">↻</button>
        </div>
        <div class="legend space-legend"><span><i class="room-key"></i>Room</span><span><i class="corridor-key"></i>Corridor</span><span><i class="other-key"></i>Other</span></div>
        <div class="legend"><span><i class="start-dot"></i>Start</span><span><i class="end-dot"></i>Destination</span><span><i class="route-key"></i>Route</span></div>
        <div class="scene-status" id="scene-status">Drag to rotate · Pinch to zoom</div>
      </section>

      <section class="planner">
        <div class="field"><label for="from">From</label><input id="from" list="room-options" type="search" autocomplete="off" placeholder="Search 1,262 rooms"></div>
        <button class="swap" id="swap" title="Swap start and destination" aria-label="Swap start and destination">⇅</button>
        <div class="field"><label for="to">To</label><input id="to" list="room-options" type="search" autocomplete="off" placeholder="Search room number"></div>
        <datalist id="room-options"></datalist>
        <label class="toggle"><input id="accessible" type="checkbox"><span>Accessible route</span></label>
        <button class="primary" id="go">Show 3D route</button>
        <div class="examples"><button data-from="WEH-5222" data-to="WEH-5434">Wean L5</button><button data-from="SH-4N103" data-to="WEH-4325">Scott → Wean</button><button data-from="WEH-5130" data-to="WEH-4325">Level 5 → 4</button></div>
      </section>

      <section id="result" class="directions" aria-live="polite"></section>
    </main>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
